# THIS FILE IS NEVER READ by GitLab CI.
#
# THIS project's Settings → CI/CD → General pipelines → "CI/CD
# configuration file" setting points to a path in the
# sonar-migration-engine repository (e.g.
# "ci/pipeline.yml@groupe/sonar-migration-engine"). This setting,
# documented in the monorepo's root README, § "CI configuration path", is
# what neutralizes the "I modify the pipeline in the same merge request
# as my request" threat: even merged into main, this file has no effect.
#
# It is deliberately kept here, with this comment, so that a contributor
# who opens it out of reflex immediately understands why nothing happens.
# Do NOT add jobs to it: they would never run, and on a day when the
# externalized setting got accidentally reset, this file would become
# active again — better that it stays empty.
