# SonarQube instance inventory — AUTHORITATIVE.
#
# One entity = one instance = one set of protected variables. This file
# lives in sonar-migration-engine, not writable by project teams.
# See root README.md, § "why the inventory is not in the requests
# repository".
#
# The name of the variable carrying the admin token is DERIVED from 'id'
# (SONAR_SRC_<ID IN UPPERCASE>_TOKEN) and normally does not need to be
# entered. Use 'variable_token' only as an exception, in which case it
# must match ^SONAR_SRC_[A-Z0-9_]+_TOKEN$.
version: 1

# Groups whose holding the admin permission never counts as authorization
# (see prompt §5). Case-insensitive comparison. Completed in batch 2.
groupes_interdits:
  - Anyone
  - sonar-users
  - Members

centrale:
  id: centrale
  libelle: Group central instance
  url: https://sonar.groupe.example
  # v1 | v2 — see docs/a-verifier.md, uncertainty point #2. To confirm
  # on the real instance before batch 2.
  api_identite: v2
  fournisseur_identite_sso: saml-entreprise  # exact name as configured on the Sonar side — to confirm, see docs/a-verifier.md
  ssh_hote: sonar-central-01.groupe.example
  sonarqube_home: /opt/sonarqube

# One entry per already-onboarded entity. The catalogue published to
# requesters (sonar-migration-requests/docs/instances-disponibles.md) is
# derived from this list by 'inventaire.catalogue_public' — it only
# exposes id/libelle.
instances_sources:
  - id: entite-exemple
    libelle: Example Entity (onboarding template)
    url: https://sonar.exemple.example
    api_identite: v1
    fournisseur_identite_sso: saml-entreprise  # exact name as configured on the Sonar side — to confirm, see docs/a-verifier.md
    ssh_hote: sonar-exemple-01.exemple.example
    sonarqube_home: /opt/sonarqube
    # Disabled: this is only a template to duplicate during a real
    # onboarding, not an existing instance. Remove 'actif: false' once
    # the information is replaced with real values.
    actif: false
