[project]
name = "sonar-migration-engine"
version = "0.1.0"
description = "Control plane (GitLab CI) and execution plan (Ansible) for the self-service, cross-instance SonarQube migration."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# PYI034 (Self as __enter__'s return type) requires 'from typing import
# Self', only available in 3.11+. The package targets 3.11+, but the
# tests also run under the local development interpreter (3.9) — see
# root README. The explicit class name is kept rather than breaking local
# execution for a style preference.
ignore = [
    "PYI034",  # Self as __enter__'s return type: needs typing.Self, 3.11+ only
    "UP017",   # datetime.UTC: needs Python 3.11+; timezone.utc stays 3.9-compatible
]
