---
# Shared step: look up a project by its exact key and reduce the response
# to the (at most one) matching component.
#
# Extracted after a real bug: 10 call sites across 5 roles each
# independently reimplemented this lookup, and every one of them
# originally omitted the '?projects=' filter (see docs/a-verifier.md).
# Centralizing it here means the fix — and any future one — happens
# exactly once instead of ten times.
#
# Input vars (set by the including task via 'vars:'):
#   sonar_cle_recherche : the key to search for.
#   sonar_recherche_nom  : task name shown in the play recap, so the
#                           including role's log stays readable despite
#                           the indirection.
# Output: sonar_composants_trouves, a list of 0 or 1 matching component.
# Consume it immediately (or copy it to a role-specific fact right away)
# before including this file again in the same role — a second inclusion
# overwrites it.

- name: "{{ sonar_recherche_nom }}"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/projects/search?projects={{ sonar_cle_recherche | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    status_code: 200
  register: _sonar_reponse_recherche_projet
  no_log: true

- name: "Reduce to the exact match for {{ sonar_cle_recherche }}"
  ansible.builtin.set_fact:
    sonar_composants_trouves: "{{ _sonar_reponse_recherche_projet.json.components | default([]) | selectattr('key', 'equalto', sonar_cle_recherche) | list }}"
