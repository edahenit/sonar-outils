---
# Prompt step 7: capture the portal project's configuration BEFORE its
# deletion — this is what will no longer be readable once the project is
# destroyed, and what sonar_appliquer_config reapplies at the end of the
# sequence.
#
# Idempotent: read-only, safely replayable (overwrites the previous
# captured file, which is the desired behavior on a resumption before
# deletion — capture again rather than trust a potentially stale capture).
#
# Deviation assumed relative to the prompt: reapplication
# (sonar_appliquer_config) uses api/permissions/add_group and
# api/permissions/add_user, NOT api/permissions/apply_template — reliably
# identifying the NAME of the permission template applied by the portal
# has no confirmed read endpoint (see docs/a-verifier.md). Capturing the
# effective permission state (this block) and reapplying it permission by
# permission is functionally equivalent and relies on no guessed template
# name. If the template name turns out to be known and stable (a portal
# convention), 'sonar_permission_template_nom' (to define as an extra-var)
# would allow switching to apply_template in sonar_appliquer_config
# without touching this role.

- name: "Check input variables (assert)"
  ansible.builtin.assert:
    that:
      - sonar_cle_cible is defined
      - sonar_cle_cible is match('^[A-Za-z0-9_.:-]{1,400}$')
      - sonar_run_id is defined and sonar_run_id | length > 0
    fail_msg: "sonar_capture_config: sonar_cle_cible / sonar_run_id missing or invalid."
    quiet: true

- name: "Capture the project's quality gate"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/qualitygates/get_by_project?project={{ sonar_cle_cible | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    status_code: [200, 404]
  register: sonar_capture_qg
  no_log: true

- name: "Capture the project's quality profiles"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/qualityprofiles/search?project={{ sonar_cle_cible | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    status_code: 200
  register: sonar_capture_qp
  no_log: true

- name: "Capture the DevOps binding (if present)"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/alm_settings/get_binding?project={{ sonar_cle_cible | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    status_code: [200, 404]
  register: sonar_capture_binding
  no_log: true
  ignore_errors: true  # endpoint not confirmed (docs/a-verifier.md): does not block capturing the rest

- name: "Capture group permissions, by type"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/permissions/groups?projectKey={{ sonar_cle_cible | urlencode }}&permission={{ sonar_type_permission_courant }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    status_code: 200
  loop: "{{ sonar_types_permission }}"
  loop_control:
    loop_var: sonar_type_permission_courant
  register: sonar_capture_permissions_groupes
  no_log: true

- name: "Capture user permissions, by type"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/permissions/users?projectKey={{ sonar_cle_cible | urlencode }}&permission={{ sonar_type_permission_courant }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    status_code: 200
  loop: "{{ sonar_types_permission }}"
  loop_control:
    loop_var: sonar_type_permission_courant
  register: sonar_capture_permissions_utilisateurs
  no_log: true

# api/project_tags/search is a global tag-autocomplete endpoint (no
# project filter), NOT a per-project tag reader — using it here would have
# been wrong regardless of translation. api/components/show is the
# well-documented, stable endpoint for reading one component; the exact
# field carrying its tags in the response is not independently confirmed
# for 2026.1.2 — see docs/a-verifier.md — hence 'ignore_errors' and a
# fallback to an empty list.
- name: "Capture the project's tags"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/components/show?component={{ sonar_cle_cible | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    status_code: 200
  register: sonar_capture_tags
  no_log: true
  ignore_errors: true  # response field carrying tags not independently confirmed — see docs/a-verifier.md

# Portfolios: NOT CAPTURED — no "portfolios containing this project" read
# endpoint identified with sufficient confidence to write without
# guessing. See docs/a-verifier.md. Handled manually by the central team
# until this point is resolved (see runbook, batch 5).

- name: "Assemble and write the captured configuration"
  delegate_to: localhost
  ansible.builtin.copy:
    dest: "{{ sonar_echange_local }}/config_capturee.json"
    mode: "0600"
    content: >-
      {{
        {
          'run_id': sonar_run_id,
          'cle_cible': sonar_cle_cible,
          'quality_gate': sonar_capture_qg.json | default(None),
          'quality_profiles': sonar_capture_qp.json.profiles | default([]),
          'binding': sonar_capture_binding.json | default(None),
          'permissions_groupes': dict(
            sonar_types_permission
            | zip(sonar_capture_permissions_groupes.results | map(attribute='json.groups') | map('default', []))
          ),
          'permissions_utilisateurs': dict(
            sonar_types_permission
            | zip(sonar_capture_permissions_utilisateurs.results | map(attribute='json.users') | map('default', []))
          ),
          'tags': sonar_capture_tags.json.component.tags | default([]),
        } | to_nice_json
      }}
