---
# Tracking of a Compute Engine task — see docs/suivi_taches_ce.md for the
# full justification of this approach and the three-way outcome
# distinction (in progress / CE failure / pipeline timeout).
#
# Idempotent by nature: this role only queries the state of an
# already-triggered task, it never triggers it itself. Safely replayable
# at any point during a resumption.

- name: "Check input variables (assert)"
  ansible.builtin.assert:
    that:
      - sonar_ce_task_url_base is defined and sonar_ce_task_url_base | length > 0
      - sonar_ce_task_id is defined and sonar_ce_task_id | length > 0
      - sonar_ce_token is defined and sonar_ce_token | length > 0
      - sonar_ce_timeout_secondes is defined and sonar_ce_timeout_secondes | int > 0
      - sonar_ce_intervalle_secondes is defined and sonar_ce_intervalle_secondes | int > 0
    fail_msg: >-
      sonar_attendre_tache_ce: missing or invalid input variables.
      This role expects sonar_ce_task_url_base, sonar_ce_task_id, sonar_ce_token,
      sonar_ce_timeout_secondes, sonar_ce_intervalle_secondes.
    quiet: true

# api/ce/task is polled until a terminal status is reached, or until
# retries are exhausted. 'ignore_errors' is essential here: without it,
# the 'until' loop's failure would stop the play before the next task,
# which is precisely the one that must distinguish WHY the loop exited.
- name: "Poll the Compute Engine task's state until a terminal status"
  ansible.builtin.uri:
    url: "{{ sonar_ce_task_url_base }}?id={{ sonar_ce_task_id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ sonar_ce_token }}"
    status_code: 200
    return_content: true
  register: sonar_ce_reponse
  until: >-
    sonar_ce_reponse.json is defined
    and sonar_ce_reponse.json.task is defined
    and sonar_ce_reponse.json.task.status in ['SUCCESS', 'FAILED', 'CANCELED']
  retries: "{{ sonar_ce_tentatives | int }}"
  delay: "{{ sonar_ce_intervalle_secondes | int }}"
  no_log: true  # the Authorization header must never land in a log
  ignore_errors: true

# --- The three outcomes, explicitly distinguished -------------------------

- name: "Failure on the Compute Engine side (the task ended in error)"
  ansible.builtin.fail:
    msg: >-
      Compute Engine task {{ sonar_ce_task_id }} ended in failure:
      status {{ sonar_ce_reponse.json.task.status }}.
      {{ sonar_ce_reponse.json.task.errorMessage | default('(no detail returned by SonarQube)') }}
  when: >-
    sonar_ce_reponse.json is defined
    and sonar_ce_reponse.json.task is defined
    and sonar_ce_reponse.json.task.status in ['FAILED', 'CANCELED']

- name: "Pipeline timeout (status still non-terminal after {{ sonar_ce_timeout_secondes }} s)"
  ansible.builtin.fail:
    msg: >-
      Tracking of Compute Engine task {{ sonar_ce_task_id }} interrupted after
      {{ sonar_ce_timeout_secondes }} s with no terminal status (last known
      status: {{ sonar_ce_reponse.json.task.status | default('unknown — the
      last request itself may have failed') }}). This is NOT a failure of
      the task on the SonarQube side: it may well succeed later. Recovery:
      relaunch tracking (this role is idempotent), or increase
      sonar_ce_timeout_secondes if the data volume requires it.
  when: sonar_ce_reponse.failed | default(false)

- name: "Success: record the result for the calling role"
  ansible.builtin.set_fact:
    sonar_ce_resultat: "{{ sonar_ce_reponse.json.task }}"
  when: >-
    sonar_ce_reponse.json is defined
    and sonar_ce_reponse.json.task is defined
    and sonar_ce_reponse.json.task.status == 'SUCCESS'
