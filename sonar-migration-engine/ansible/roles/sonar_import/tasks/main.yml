---
# Prompt step 10: import of the archive, under the source key.
#
# api/project_dump/import: same reservations as for the export (see
# docs/a-verifier.md, point 3 and sonar_export/tasks/main.yml).
#
# Idempotent with caution: SonarQube normally refuses to import onto a
# project that has already been analyzed (a server-side guard, not only
# ours) — a replay after an already-successful import must therefore fail
# cleanly on the API side rather than duplicate the history, and this task
# does not mask that error.

- name: "Check input variables (assert)"
  ansible.builtin.assert:
    that:
      - sonar_cle_source is defined
      - sonar_cle_source is match('^[A-Za-z0-9_.:-]{1,400}$')
    fail_msg: "sonar_import: sonar_cle_source missing or invalid."
    quiet: true

- name: "Check that the archive to import is present"
  ansible.builtin.stat:
    path: "{{ sonar_repertoire_import }}/{{ sonar_cle_source }}.zip"
  register: sonar_stat_archive_import

- name: "The archive must be present before triggering the import"
  ansible.builtin.assert:
    that:
      - sonar_stat_archive_import.stat.exists
    fail_msg: >-
      {{ sonar_repertoire_import }}/{{ sonar_cle_source }}.zip not found:
      the transfer step probably has not succeeded yet for this run.

- name: "Trigger the archive import"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/project_dump/import"
    method: POST
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    body_format: form-urlencoded
    body:
      project: "{{ sonar_cle_source }}"
    status_code: [200, 202]
  register: sonar_import_declenchement
  no_log: true

- name: "Wait for the import Compute Engine task to finish"
  ansible.builtin.include_role:
    name: sonar_attendre_tache_ce
  vars:
    sonar_ce_task_url_base: "{{ sonar_url }}/api/ce/task"
    sonar_ce_task_id: >-
      {{ sonar_import_declenchement.json.task.id | default(sonar_import_declenchement.json.taskId) }}
    sonar_ce_token: "{{ sonar_token }}"

- name: "Confirm that the project now holds the imported history"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/rechercher_projet.yml"
  vars:
    sonar_cle_recherche: "{{ sonar_cle_source }}"
    sonar_recherche_nom: "Confirm that the project now holds the imported history"

- name: "The project under the source key must now carry an analysis"
  vars:
    composants: "{{ sonar_composants_trouves }}"
  ansible.builtin.assert:
    that:
      - composants | length == 1
      - composants[0].lastAnalysisDate is defined
    fail_msg: >-
      The Compute Engine task succeeded but {{ sonar_cle_source }} still
      has no recorded analysis — abnormal situation, alert the central
      team before proceeding to the rename step.
