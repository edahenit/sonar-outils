---
# Prompt step 6: transfer of the archive to the central server.
#
# No 'shell'/'command' task: the transfer goes through 'fetch' (source ->
# controller) then 'copy' (controller -> central, with explicit owner and
# mode), never a manually launched rsync or scp. The archive's location is
# deterministic (<source key>.zip): this role needs no state handed over
# by sonar_export, it finds it on its own — every role stays independently
# replayable.
#
# Known limitation: this playbook targets a single application node per
# instance (see the inventory, one SSH host per instance). In a
# multi-node Data Center Edition topology, the archive must be deposited
# on ALL of the central instance's application nodes — out of scope for
# this version, to be addressed in batch 4 if the central instance is
# indeed running Data Center Edition.
#
# Idempotent: 'fetch' and 'copy' are naturally idempotent (they recopy if
# the content differs, change nothing otherwise); the fingerprint is
# rechecked on every run, never only on the first.

- name: "Check input variables (assert)"
  ansible.builtin.assert:
    that:
      - sonar_cle_source is defined
      - sonar_cle_source is match('^[A-Za-z0-9_.:-]{1,400}$')
      - sonar_centrale_host is defined and sonar_centrale_host | length > 0
      - hostvars[sonar_centrale_host].sonar_home is defined
    fail_msg: "sonar_transfert: missing or invalid input variables."
    quiet: true

- name: "Check the source archive and compute its fingerprint"
  ansible.builtin.stat:
    path: "{{ sonar_repertoire_export }}/{{ sonar_cle_source }}.zip"
    checksum_algorithm: sha256
  register: sonar_stat_source

- name: "The source archive must exist before any transfer"
  ansible.builtin.assert:
    that:
      - sonar_stat_source.stat.exists
    fail_msg: >-
      {{ sonar_repertoire_export }}/{{ sonar_cle_source }}.zip not found on
      {{ inventory_hostname }}: the export step probably has not succeeded
      yet for this run.

- name: "Retrieve the archive to the controller"
  ansible.builtin.fetch:
    src: "{{ sonar_repertoire_export }}/{{ sonar_cle_source }}.zip"
    dest: "{{ sonar_echange_local }}/{{ sonar_cle_source }}.zip"
    flat: true

- name: "Deposit the archive on the central instance, with explicit owner and mode"
  ansible.builtin.copy:
    src: "{{ sonar_echange_local }}/{{ sonar_cle_source }}.zip"
    dest: "{{ hostvars[sonar_centrale_host].sonar_home }}/data/governance/project_dumps/import/{{ sonar_cle_source }}.zip"
    owner: "{{ sonar_utilisateur_service }}"
    group: "{{ sonar_utilisateur_service }}"
    mode: "0640"
  delegate_to: "{{ sonar_centrale_host }}"

- name: "Check the fingerprint of the archive deposited on the central instance"
  ansible.builtin.stat:
    path: "{{ hostvars[sonar_centrale_host].sonar_home }}/data/governance/project_dumps/import/{{ sonar_cle_source }}.zip"
    checksum_algorithm: sha256
  register: sonar_stat_centrale
  delegate_to: "{{ sonar_centrale_host }}"

- name: "The SHA-256 fingerprint must be identical before and after transfer"
  ansible.builtin.assert:
    that:
      - sonar_stat_centrale.stat.checksum == sonar_stat_source.stat.checksum
    fail_msg: >-
      Fingerprint mismatch after transfer: source={{ sonar_stat_source.stat.checksum }},
      central={{ sonar_stat_centrale.stat.checksum }}. Archive corrupted in
      transit — never import an archive whose fingerprint does not match,
      rerun this role (idempotent).
    success_msg: "Transfer verified: sha256={{ sonar_stat_centrale.stat.checksum }}."
