---
# Prompt step 9 — subject to uncertainty point #1 (docs/a-verifier.md):
# Project Move may require a project already created, blank, and holding
# the SOURCE KEY before importing, or may create that project itself on
# import. Parameter 'sonar_create_placeholder_project' (group_vars/all.yml,
# default true): this role is a complete no-op if false, with no other
# role needing to know about it.
#
# Idempotent: if a project already exists under this key (resumption after
# an earlier successful pass), creation is simply skipped rather than
# raising an error — 'api/projects/create' returns an expected error
# status in this exact case, explicitly accepted.

- name: "Check input variables (assert)"
  ansible.builtin.assert:
    that:
      - sonar_cle_source is defined
      - sonar_cle_source is match('^[A-Za-z0-9_.:-]{1,400}$')
    fail_msg: "sonar_creer_placeholder: sonar_cle_source missing or invalid."
    quiet: true
  when: sonar_create_placeholder_project | bool

- name: "Check whether a project already exists under the source key (resumption)"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/rechercher_projet.yml"
  vars:
    sonar_cle_recherche: "{{ sonar_cle_source }}"
    sonar_recherche_nom: "Check whether a project already exists under the source key (resumption)"
  when: sonar_create_placeholder_project | bool

- name: "Create the blank project holding the source key"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/projects/create"
    method: POST
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    body_format: form-urlencoded
    body:
      project: "{{ sonar_cle_source }}"
      name: "{{ sonar_cle_source }}"
    status_code: 200
  no_log: true
  when:
    - sonar_create_placeholder_project | bool
    - (sonar_composants_trouves | default([]) | length) == 0

- name: "Confirm that the placeholder project is indeed blank"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/rechercher_projet.yml"
  vars:
    sonar_cle_recherche: "{{ sonar_cle_source }}"
    sonar_recherche_nom: "Confirm that the placeholder project is indeed blank"
  when: sonar_create_placeholder_project | bool

- name: "The placeholder must exist and must never have been analyzed"
  vars:
    composants: "{{ sonar_composants_trouves }}"
  ansible.builtin.assert:
    that:
      - composants | length == 1
      - composants[0].lastAnalysisDate is not defined
    fail_msg: >-
      The placeholder project {{ sonar_cle_source }} does not exist or has
      already been analyzed — abnormal situation, do not proceed to import.
  when: sonar_create_placeholder_project | bool
