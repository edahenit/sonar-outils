---
# Prompt step 8 — POINT OF NO RETURN. Deletes the blank project created by
# the portal to free up the target key. From here on, a failure leaves the
# DevOps space with no Sonar project: recovery is no longer optional.
#
# NOT idempotent in the usual sense: replaying this role after a success
# will normally fail (the project no longer exists) — that is the desired
# behavior, not a defect. A replay after a deletion failure, however, must
# be safe: this is why the recheck below is on the INTERNAL ID, not just
# the key (see root README, § "target project substitution between check
# and execution").

- name: "Check input variables (assert)"
  ansible.builtin.assert:
    that:
      - sonar_cle_cible is defined
      - sonar_cle_cible is match('^[A-Za-z0-9_.:-]{1,400}$')
      - sonar_projet_cible_id is defined and sonar_projet_cible_id | length > 0
    fail_msg: >-
      sonar_supprimer_cible: sonar_cle_cible / sonar_projet_cible_id
      missing — deletion never happens without the internal id captured
      at the authorization check, never on the key alone.
    quiet: true

- name: "Recheck the target project's identity and blankness just before deletion"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/rechercher_projet.yml"
  vars:
    sonar_cle_recherche: "{{ sonar_cle_cible }}"
    sonar_recherche_nom: "Recheck the target project's identity and blankness just before deletion"

- name: "The internal id must be unchanged, the project still blank"
  vars:
    composants: "{{ sonar_composants_trouves }}"
  ansible.builtin.assert:
    that:
      - composants | length == 1
      - composants[0].id == sonar_projet_cible_id
      - composants[0].lastAnalysisDate is not defined
    fail_msg: >-
      Substitution detected: the project found for key {{ sonar_cle_cible }}
      no longer matches what was verified by the authorization check
      (captured id {{ sonar_projet_cible_id }}). Deletion refused —
      contact the central team, never insist past this refusal.
    success_msg: "Target project confirmed identical (id={{ sonar_projet_cible_id }}): deletion authorized."

- name: "Delete the portal project — IRREVERSIBLE"
  ansible.builtin.uri:
    url: "{{ sonar_url }}/api/projects/delete"
    method: POST
    headers:
      Authorization: "Bearer {{ sonar_token }}"
    body_format: form-urlencoded
    body:
      project: "{{ sonar_cle_cible }}"
    status_code: [200, 204]
  no_log: true

- name: "Check that the target key is now free"
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/rechercher_projet.yml"
  vars:
    sonar_cle_recherche: "{{ sonar_cle_cible }}"
    sonar_recherche_nom: "Check that the target key is now free"

- name: "The target key must no longer match any project"
  vars:
    composants_restants: "{{ sonar_composants_trouves }}"
  ansible.builtin.assert:
    that:
      - composants_restants | length == 0
    fail_msg: >-
      Deletion appears to have failed silently: {{ sonar_cle_cible }}
      still matches a project. TARGET_DELETED step not confirmed —
      do not log this state, alert the central team.
